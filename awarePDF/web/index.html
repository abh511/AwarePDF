<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AwarePDF</title>
  <meta name="description" content="AI textbook assistant: ask questions with page citations, summaries, topics, key points and diagram search.">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5f5b'/%3E%3Cpath d='M9 8h9l5 5v11H9z' fill='%23f6f3ec'/%3E%3Cpath d='M12 17h8M12 20h6' stroke='%231f5f5b' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z" fill="currentColor" opacity=".18"/><path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 16.5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-summary" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h9M5 18h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-topics" viewBox="0 0 24 24"><path d="M5 5h3v3H5zM11 6.5h8M8 12h3v3H8zM14 13.5h5M8 18h3v3H8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M6.5 8v11.5H8M6.5 13.5H8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12.5h8L17 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8zM14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13h6M9 16.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5 11 13M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5c.6 4.3 2.2 5.9 6.5 6.5-4.3.6-5.9 2.2-6.5 6.5-.6-4.3-2.2-5.9-6.5-6.5 4.3-.6 5.9-2.2 6.5-6.5zM18.5 15.5c.3 1.8.9 2.4 2.7 2.7-1.8.3-2.4.9-2.7 2.7-.3-1.8-.9-2.4-2.7-2.7 1.8-.3 2.4-.9 2.7-2.7z" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5V8h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  </svg>

  <div class="app" id="app">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="brand-mark"><use href="#i-logo"/></svg>
        <span class="brand-name">AwarePDF</span>
        <button class="icon-btn only-mobile" id="closeSidebar" aria-label="Close menu"><svg><use href="#i-close"/></svg></button>
      </div>

      <button class="upload-btn" id="uploadBtn">
        <svg><use href="#i-upload"/></svg>
        <span>Upload a textbook</span>
      </button>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>

      <div class="library-head">
        <span>Library</span>
        <span class="count" id="libraryCount"></span>
      </div>
      <ul class="library" id="library" aria-label="Your books"></ul>

      <div class="sidebar-foot">
        <div class="status-dot" id="serverStatus"><span></span><em>Connecting</em></div>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="show-light"><use href="#i-moon"/></svg>
          <svg class="show-dark"><use href="#i-sun"/></svg>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- ================= MAIN ================= -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
        <div class="book-title" id="bookTitle"></div>
        <nav class="tabs" id="tabs" role="tablist" hidden>
          <button role="tab" data-view="chat" aria-selected="true"><svg><use href="#i-chat"/></svg><span>Ask</span></button>
          <button role="tab" data-view="summary"><svg><use href="#i-summary"/></svg><span>Summary</span></button>
          <button role="tab" data-view="topics"><svg><use href="#i-topics"/></svg><span>Topics</span></button>
          <button role="tab" data-view="keypoints"><svg><use href="#i-star"/></svg><span>Key points</span></button>
          <button role="tab" data-view="figures"><svg><use href="#i-image"/></svg><span>Figures</span></button>
        </nav>
        <button class="icon-btn" id="togglePdf" aria-label="Show the PDF" title="Show the PDF" hidden><svg><use href="#i-pdf"/></svg></button>
      </header>

      <div class="view" id="view"></div>
    </main>

    <!-- ================= PDF PANEL ================= -->
    <aside class="pdf-panel" id="pdfPanel" aria-label="PDF viewer" hidden>
      <div class="pdf-resize" id="pdfResize" title="Drag to resize"></div>
      <div class="pdf-head">
        <div class="pdf-nav">
          <button class="icon-btn sm" id="pdfPrev" aria-label="Previous page"><svg><use href="#i-chev-l"/></svg></button>
          <label class="pdf-page">Page <input type="number" id="pdfPageInput" min="1" inputmode="numeric"> <span id="pdfPageTotal"></span></label>
          <button class="icon-btn sm" id="pdfNext" aria-label="Next page"><svg><use href="#i-chev-r"/></svg></button>
        </div>
        <a class="icon-btn sm" id="pdfOpenTab" target="_blank" rel="noopener" aria-label="Open in a new tab" title="Open in a new tab"><svg><use href="#i-external"/></svg></a>
        <button class="icon-btn sm" id="pdfClose" aria-label="Close the PDF"><svg><use href="#i-close"/></svg></button>
      </div>
      <iframe id="pdfFrame" title="PDF document"></iframe>
    </aside>
  </div>

  <!-- Drag-and-drop overlay -->
  <div class="drop-overlay" id="dropOverlay" hidden>
    <div><svg><use href="#i-upload"/></svg><p>Drop your PDF to add it to the library</p></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="icon-btn lb-close" id="lbClose" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    <button class="icon-btn lb-prev" id="lbPrev" aria-label="Previous figure"><svg><use href="#i-chev-l"/></svg></button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption><span id="lbCaption"></span><button class="btn ghost sm" id="lbOpenPage"><svg><use href="#i-pdf"/></svg>Open page</button></figcaption>
    </figure>
    <button class="icon-btn lb-next" id="lbNext" aria-label="Next figure"><svg><use href="#i-chev-r"/></svg></button>
  </div>

  <!-- Login -->
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <svg class="login-icon"><use href="#i-lock"/></svg>
      <h1>AwarePDF</h1>
      <p>This study space is private. Enter the password to continue.</p>
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
      <p class="login-error" id="loginError" hidden></p>
      <button class="btn primary block" type="submit">Continue</button>
    </form>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
